# Compose de PRODUÇÃO LOCAL — Postgres + Redis persistentes.
# Uso: docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
# (senhas via POSTGRES_PASSWORD / REDIS_PASSWORD no .env.production)
name: plataforma-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plataforma}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env.production}"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-prod:
  redisdata-prod:
